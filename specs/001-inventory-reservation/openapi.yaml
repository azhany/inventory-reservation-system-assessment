openapi: 3.1.0
info:
  title: Inventory Reservation API
  version: 0.1.0
  description: Proposed HTTP contract derived from the Inventory Reservation System coding challenge.
servers:
  - url: http://localhost:3000/api/v1
paths:
  /products/{productId}/inventory:
    get:
      summary: Get inventory state
      parameters:
        - $ref: '#/components/parameters/ProductId'
      responses:
        '200':
          description: Inventory state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Inventory'
        '404':
          $ref: '#/components/responses/NotFound'

  /products/{productId}/reservations:
    post:
      summary: Reserve one item for two minutes
      parameters:
        - $ref: '#/components/parameters/ProductId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId]
              properties:
                userId:
                  type: string
                  format: uuid
      responses:
        '201':
          description: Reservation created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reservation'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: No stock available
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /reservations/{reservationId}:
    get:
      summary: Get reservation
      parameters:
        - $ref: '#/components/parameters/ReservationId'
      responses:
        '200':
          description: Reservation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reservation'
        '404':
          $ref: '#/components/responses/NotFound'

  /reservations/{reservationId}/confirm:
    post:
      summary: Confirm an active reservation
      parameters:
        - $ref: '#/components/parameters/ReservationId'
      responses:
        '200':
          description: Reservation confirmed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reservation'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Reservation cannot be confirmed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /reservations/{reservationId}/cancel:
    post:
      summary: Cancel an active reservation
      parameters:
        - $ref: '#/components/parameters/ReservationId'
      responses:
        '200':
          description: Reservation cancelled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reservation'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Reservation cannot be cancelled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  parameters:
    ProductId:
      name: productId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ReservationId:
      name: reservationId
      in: path
      required: true
      schema:
        type: string
        format: uuid

  responses:
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:
    Inventory:
      type: object
      required: [productId, totalStock, soldStock, reservedStock, availableStock]
      properties:
        productId:
          type: string
          format: uuid
        totalStock:
          type: integer
          minimum: 0
        soldStock:
          type: integer
          minimum: 0
        reservedStock:
          type: integer
          minimum: 0
        availableStock:
          type: integer
          minimum: 0

    Reservation:
      type: object
      required: [id, productId, userId, status, expiresAt, createdAt]
      properties:
        id:
          type: string
          format: uuid
        productId:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        status:
          type: string
          enum: [ACTIVE, CONFIRMED, CANCELLED, EXPIRED]
        expiresAt:
          type: string
          format: date-time
        confirmedAt:
          type: [string, 'null']
          format: date-time
        cancelledAt:
          type: [string, 'null']
          format: date-time
        createdAt:
          type: string
          format: date-time

    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
