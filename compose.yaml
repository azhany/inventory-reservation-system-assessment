x-database-environment: &database-environment
  POSTGRES_DB: ${POSTGRES_DB:-inventory}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-inventory_local_only}
  POSTGRES_USER: ${POSTGRES_USER:-inventory}

x-api-environment: &api-environment
  DATABASE_URL: postgresql://${POSTGRES_USER:-inventory}:${POSTGRES_PASSWORD:-inventory_local_only}@database:5432/${POSTGRES_DB:-inventory}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  NODE_ENV: development
  PORT: 3000

services:
  database:
    image: postgres:17-alpine3.22
    environment: *database-environment
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - development_database:/var/lib/postgresql/data

  api:
    build:
      context: .
      target: development
    environment: *api-environment
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health/ready').then((response) => { if (!response.ok) process.exit(1); }).catch(() => process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
    init: true
    ports:
      - "${PORT:-3000}:3000"
    stop_grace_period: 10s
    volumes:
      - .:/app
      - api_node_modules:/app/node_modules

  migrate:
    build:
      context: .
      target: development
    command: ["npm", "run", "db:migrate"]
    environment: *api-environment
    depends_on:
      database:
        condition: service_healthy
    profiles: ["tools"]
    volumes:
      - .:/app
      - api_node_modules:/app/node_modules

volumes:
  api_node_modules:
  development_database:
